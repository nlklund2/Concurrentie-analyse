<!doctype html>
<html lang="nl">
<head>
  <title>Kaarten zonder aria-label of heading (Action-patroon)</title>
</head>
<body>
  <h1>Sokken</h1>
  <div class="grid">
    <!-- Action plakt maat, aantal en varianten aan de productnaam vast; er is
         geen aria-label, geen img-alt en geen heading om op terug te vallen -->
    <article class="card">
      <a href="/nl-nl/p/compressiesokken-8712345">CompressiesokkenMaten 35 - 46 | 2 paar | diverse kleuren</a>
      <div class="price">€ 2,48</div>
    </article>
    <article class="card">
      <a href="/nl-nl/p/pairz-sportsokken-8767890">Pairz sportsokkenMaten 23 - 38 | 3 paar | diverse kleuren</a>
      <div class="price">€ 1,00</div>
    </article>
    <article class="card">
      <a href="/nl-nl/p/dames-hemd-8711111">Dames hemd | 2 stuks</a>
      <div class="price">€ 3,99</div>
    </article>
  </div>
</body>
</html>
