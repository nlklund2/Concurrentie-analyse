<!doctype html>
<html lang="nl">
<head>
  <title>Prijzen met het euroteken achter het getal (C&amp;A-patroon)</title>
</head>
<body>
  <h1>Baby nachtkleding</h1>
  <div class="grid">
    <!-- C&A-structuur uit de diagnose: prijs in een div.italic ín de link,
         geschreven als '24,99 €' — getal eerst, teken erachter -->
    <div class="mr-6 flex">
      <a href="/nl/nl/shop/baby-pyjama-dino-3082714_1.html" class="cursor-pointer no-underline">
        <img src="x.jpg" alt="Baby pyjama dino">
        <div class="flex items-center"><div><div class="italic">24,99 €</div></div></div>
      </a>
    </div>
    <div class="mr-6 flex">
      <a href="/nl/nl/shop/baby-romper-sterren-3099001_1.html" class="cursor-pointer no-underline">
        <img src="y.jpg" alt="Baby romper sterren">
        <div class="flex items-center"><div>
          <div class="line-through">17,99 €</div>
          <div class="italic">9,99 €</div>
        </div></div>
      </a>
    </div>
  </div>
</body>
</html>
