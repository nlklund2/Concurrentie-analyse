# =====================================================================
# Bronconfiguratie concurrentiemonitor terStal — focus: ONDERGOEDMODE
# ---------------------------------------------------------------------
# strategy: auto | shopify | listing | sitemap_pages
#   'auto' probeert: Shopify-JSON → categorielijstpagina's → productpagina's.
# seeds: handmatige categorie-URLs; vult/vervangt automatische ontdekking.
# url_filter: substring waaraan URLs uit sitemaps moeten voldoen
#   (essentieel bij internationale sites: houdt alleen het NL-deel over).
# color_slot: vaste grafiekkleur in het dashboard (1-8); kleur volgt de
#   bron, nooit de selectie — niet hergebruiken voor een andere bron.
#   Houd gelijk aan de SLOTS-map in dashboard/index.html.
#
# FOCUS: focus_categories beperkt de crawl tot ondergoed-achtige
# categorieën (scheelt ~80-90% requests); focus_product_types houdt na
# de mapping alleen bodywear over. Verbreden naar het hele assortiment =
# beide regels leegmaken. Badmode meenemen = 'badmode' aan de lijst
# toevoegen en '|badmode|bikini|zwem' aan de regex plakken.
#
# Validatiestatus: draai de workflow "Validatie bronnen" (GitHub > Actions)
# voor een actueel proefrapport per bron. Vanuit de ontwikkelomgeving is
# het netwerk beperkt; de definitieve validatie gebeurt dus op GitHub.
# =====================================================================

defaults:
  strategy: auto
  min_delay: 0.7
  max_categories: 40
  max_pages_per_category: 40
  max_products: 30000
  sitemap_page_cap: 2500
  min_products_expected: 25
  respect_robots: true
  # Verrijking: artikelen zonder kleur én maten worden via hun productpagina
  # aangevuld, nieuwe artikelen eerst. Cap houdt de run kort (±2 min per bron).
  enrich: true
  enrich_limit: 150
  focus_categories: "ondergoed|lingerie|onderkleding|underwear|nachtmode|nachtkleding|nachthemd|pyjama|onesie|homewear|lounge|\\bsok|kousen|panty|maillot|boxer|\\bbh\\b|beha|\\bslip|hemd|singlet|shapewear|ondermode"
  focus_product_types: [ondergoed, nachtmode, "sokken & panty's"]

retailers:
  # ---- referentie: eigen assortiment (verplicht voor de prijsindex) ----
  terstal:
    name: terStal familiemode
    base: https://www.terstal.nl
    segment: referentie
    color_slot: 1
    notes: >-
      Eigen winkel — referentielijn voor alle indexcijfers.
      DIAGNOSE 09-08: prijsdekking blijft 43%. Op een prijsloze productpagina
      (2-pack Australian boxershorts) staat aantoonbaar géén machineleesbare
      eigen prijs: geen microdata, geen prijs-attributen; de enige EUR in de
      tekst is een verzendbanner en de 24 prijsachtige getallen komen uit het
      aanbevelingenblok (recommendations.terstal-nl.workers.dev — bewust NIET
      als bron overgenomen: dat zijn andere artikelen, de Zeeman-aanraderval).
      Mogelijk zijn dit uitverkochte/verlopen sitemap-artikelen. De koninklijke
      route voor de eigen referentielijn is een wekelijkse PIM/kassa-export,
      geen scraper — besluit bij de eigenaar.

  # ---- kern: het gevraagde concurrentieveld ondergoedmode ----
  zeeman:
    name: Zeeman
    base: https://www.zeeman.com/nl
    segment: kern
    # EINDOORDEEL 18-08 (na hermeting op de júiste sitemap): Zeeman serveert
    # ons op elke laag uitgeklede pagina's. De canonieke /nl-nl/product/-
    # pagina's (24.833 stuks, via robots.txt → /sitemap/index.xml) dragen in
    # de kale HTML alleen een klein gedeeld productsetje — 34 van 40
    # proefpagina's vielen op dezelfde 5 sleutels samen — en ook gerenderd
    # toont de pagina de eigen prijs niet (0 euro-tekens). /api/* is per
    # robots.txt verboden. Bron blijft rood met de poort dicht; folder en
    # winkelbezoek blijven het kanaal. Deze config is wél de juiste basis
    # (nl-nl in plaats van ook nl-be, echte artikelen in plaats van
    # badge-widgets) en draait als gratis wekelijkse hertest: zet Zeeman
    # ooit echte servering aan, dan pakt de route het vanzelf op.
    # Meting 19-08: ook ?page=-paginering getoetst (dames/ondergoed?page=2,
    # heren/ondergoed?page=1) — zelfde uitgeklede serving, 0 producten in
    # kale én gerenderde HTML, geen product-API's onderweg. Bewijsdossier:
    # docs/validaties/.
    url_filter: "/nl-nl/product/"
    color_slot: 2
    strategy: sitemap_pages
    sitemap_page_cap: 400
    enrich: false
    notes: >-
      Maatstaf waardetextiel; sterk in basics-ondergoed en sokken.
      OMGEZET 09-08 naar de render-strategie. Zeeman is een client-side app:
      de lijstpagina's leverden via HTTP nul producten, en op de productpagina's
      staat in de HTML alleen een aanraderblok — 60 verschillende pagina's,
      gelijkmatig over 9.672 URL's bemonsterd, leverden 6 artikelen op (dezelfde
      zes). De prijzen en doelgroepen daarvan klopten, dus de bron zelf is prima;
      alleen komt de data pas na het renderen beschikbaar. Caps krap gehouden
      (30 categorieën x 10 pagina's) zodat de weekrun onder ±25 min blijft.
      OORZAAK GEVONDEN 09-08 (paginadiagnose): de Cookiebot-muur staat er wel
      degelijk, maar rendert asynchroon — ná onze klikpoging — en de knop heet
      'Alles toestaan', een tekst die de consent-routine niet kende. Daardoor
      bleef de muur staan en laadde het Algolia-productraster nooit (0 prijzen
      in de tekst; de 'prijsachtige getallen' bleken versienummers in de
      cookiedialoog). Fix: consent-herkansing ná networkidle + 'Alles
      toestaan' in de tekstenlijst. Algolia-calls worden al onderschept door
      de API-sink, dus na de klik kan de data via die route binnenkomen.
      HERVALIDATIE 09-08 (run 14): NIET opgelost — 6 'artikelen', en de titels
      ontmaskeren ze: 'Cookiebot Usercentrics' en 4x 'Trusted Shops' met prijs
      €4.44 / was €5.00 — dat is de shopwaardering 4,44 van 5, gelezen als
      afprijzing. De muur of het raster blokkeert dus nog steeds, en de
      getal-eerst-prijsscan maakt van badges nepproducten. BRON BLIJFT ROOD;
      de weekpoort (minimaal 25) houdt deze rommel uit de database. Geen
      derde poging zonder nieuwe diagnose-informatie; alternatief is Firecrawl
      (zelfde route als Wibra/HEMA) of accepteren dat Zeeman ontbreekt.
  wibra:
    name: Wibra
    base: https://www.wibra.nl
    segment: kern
    color_slot: 3
    strategy: firecrawl
    # DOORBRAAK 10-08 (meetronde 2): wibra.nl draait op WordPress/WooCommerce
    # en de publieke Store-API staat open — 762 producten, geldige JSON met
    # naam, prijs (minor units), permalink, categorieën én maat/kleur-
    # attributen. De hele catalogus in ±8 credits per week, waar de
    # productpagina's (ronde 6, 09-08) niets machineleesbaars droegen.
    firecrawl_mode: wp_store
    enrich: false
    max_categories: 20
    notes: >-
      Zelfde klant, zelfde prijspunten; ondergoed/nachtmode kerncategorie.
      GEVALIDEERD 07-08: blokkeert ook een echte headless browser al bij het
      laden — het datacenter-IP van GitHub Actions wordt geweerd. Enige route
      is een residentiële proxy: strategy 'firecrawl' (betaald, activeer met
      FIRECRAWL_API_KEY). Zonder sleutel blijft de bron rood in de tabel.
      FIRECRAWL GETEST 09-08 (6 rondes): blokkade doorbroken, maar de site
      geeft zijn LIJSTEN niet prijs — sitemap kent 1 lijstpagina, navigatie
      alleen productteasers. Ronde 6 (firecrawl_mode 'pages') haalde alle
      38 bodywear-productpagina's uit de sitemap op: ALLE 38 zonder
      leesbare productdata — geen JSON-LD, geen __NEXT_DATA__, geen
      og:prijs-metatags. EINDOORDEEL: technisch uitgeput; bron blijft rood.
      BESLUIT 09-08: blijft aan als wekelijkse hertest, maar met kanarie —
      ±8 i.p.v. ±42 credits per week. Enige resterende route: iemand
      opent wibra.nl in een gewone browser, navigeert naar het
      ondergoed-overzicht en levert die URL aan als seed — dán kan de
      lijstroute met het kaart-vangnet het opnieuw proberen.
  primark:
    name: Primark
    base: https://www.primark.com/nl-nl
    segment: kern
    url_filter: "/nl-nl"
    color_slot: 4
    notes: >-
      Geen webshop-verkoop, wel productpagina's met prijzen — prijsreferentie;
      online dekking kan kleiner zijn dan het winkelschap.
      GEVALIDEERD 07-08: werkt via lijstpagina's, kleurdekking 100%.
  action:
    name: Action
    base: https://www.action.com/nl-nl
    segment: kern
    url_filter: "/nl-nl"
    color_slot: 5
    strategy: render
    enrich: false
    max_categories: 20
    max_pages_per_category: 15
    # Herijkt 03-09: bewijsprobe na de verse-sessie-fix leverde 222 artikelen
    # over de zes categorieën (ondergoed 109, panty's 37, pyjama's 36, sokken
    # 29+11). De oude "~24" was een meetfout: de sessiewering blokkeerde alles
    # na de eerste categorie, vijf weken lang. Drempel op ±45% van de bewezen
    # baseline; de <50%-van-vorige-week-regel blijft de fijne breukdetectie.
    min_products_expected: 100
    notes: >-
      Prijszetter in sokken/boxers-multipacks.
      GEVALIDEERD 07-08: WERKT via de render-strategie nadat de cookiemuur wordt
      weggeklikt. LET OP 09-08: de categoriepaden (/c/mode/ondergoed) dragen
      géén doelgroep, dus de mapping leunt volledig op de titel; banners
      geweerd via de productlink-eis in de DOM-scan.
      DOORBRAAK 03-09: W32-36 bevatte alleen de eerste categorie (24 stuks
      nachtmode) — Action weert de opgebouwde browsersessie: elke URL laadt
      in een verse sessie (HTTP 200), maar binnen één sessie is al de tweede
      goto dicht. De verse-sessie-herkansing in render_listing lost dat op
      (probe: 17 pagina's alsnog geladen, 0 definitief geblokkeerd, 222
      artikelen, 100% prijs). Het raster pagineert servergerenderd (?page=N);
      kaarten dragen per-stuk-notaties ("€ 2,48/st") die niet als tweede
      verkoopprijs tellen.
  hema:
    name: HEMA
    base: https://www.hema.nl
    segment: kern
    color_slot: 6
    strategy: firecrawl
    enrich: false
    max_categories: 20
    # DOORBRAAK 10-08 (meetronde 5-6): met 8 s extra rendertijd verschijnt het
    # raster, en elke tegel draagt zijn naam, masterSKU en prijs als
    # HTML-ge-escapete JSON in een attribuut. De escaped-attrs-extractie leest
    # dat; bewijsprobe: 181 artikelen uit 20 categorieën, 159 binnen focus,
    # 100% prijs- en kleurdekking, ±24 credits. De promo-drempel van 60
    # hieronder blijft als extra slot op de deur.
    firecrawl_wait_ms: 8000
    # De kanarie kijkt naar de JSON-route, niet naar de kaartoogst — die
    # levert bij een niet-renderend raster alleen promoblokken op. Vijf
    # categorieën zonder ingebedde productdata en de run stopt (±6 i.p.v.
    # ±24 credits); rendert het raster wél, dan gaat hij door tot 20.
    firecrawl_canary: 5
    # Poort omhoog: de promo-oogst (26 'artikelen': koffie, koekjes, ga-naar-
    # home-tegels) zou de standaarddrempel van 25 nét passeren en week 33
    # vervuilen. Een écht productraster levert honderden artikelen; pas dan
    # mag HEMA de database in.
    min_products_expected: 60
    notes: >-
      Sterk in ondergoed/bh's; hoger prijspunt — bovengrens van het speelveld.
      GEVALIDEERD 07-08: weert ook een echte headless browser al bij het laden
      (datacenter-IP geblokkeerd). Route: strategy 'firecrawl' (betaald,
      FIRECRAWL_API_KEY). Zonder sleutel blijft de bron rood.
      FIRECRAWL GETEST 09-08 (5 rondes): blokkade doorbroken, sitemap levert
      perfecte bodywear-categorieën (/kind/ondergoed/…, /dames/lingerie) —
      maar het productraster laadt lui en rendert niet binnen de snapshot;
      het kaart-vangnet las alleen de promoblokken eromheen (koffie en
      koekjes die via het crawlpad als bodywear zouden meetellen). Daarom
      drempel op 60: promo-rommel komt daar nooit overheen, een echt raster
      (honderden artikelen) wel. RONDE 6 (09-08): scroll-acties meegegeven
      (geaccepteerd, geen 400) — oogst exact gelijk aan zonder acties:
      zelfde 26 promo-artikelen. Het raster verschijnt niet in de
      Firecrawl-snapshot, ook niet na scrollen. EINDOORDEEL: technisch
      uitgeput; bron blijft rood, de drempel van 60 bewaakt de data.
      BESLUIT 09-08: blijft aan als wekelijkse hertest, maar met kanarie —
      ±6 i.p.v. ±24 credits per week. HEMA's folder/winkel blijft het
      alternatief voor prijspeiling zolang het raster niet rendert.
  c-and-a:
    name: C&A
    base: https://www.c-and-a.com/nl/nl/shop
    segment: kern
    url_filter: "/nl/nl/"
    color_slot: 7
    strategy: render
    enrich: false
    max_categories: 40
    max_pages_per_category: 15
    # Gekalibreerd 09-08: zie Action. C&A's productraster is maar deels leesbaar
    # (165 links en 38 prijzen op de pagina, waarvan we er ~5 als kaart
    # herkennen) — 16 artikelen is voorlopig de eerlijke opbrengst.
    min_products_expected: 12
    notes: >-
      Gezinsmode incl. breed ondergoed.
      GEVALIDEERD 07-08: pagina's laden volledig via de render-strategie (141
      links, prijzen aanwezig); productkaart-extractie verbeterd 07-08 zodat de
      prijs-buiten-de-link wordt opgepikt.
      GEREPAREERD 09-08: navigatietegels ("Voor meisjes", "shoppen") stonden als
      artikel in de cijfers; de DOM-scan eist nu een echte productlink. Dekking
      over doelgroepen is goed sinds de spreiding (baby/dames/heren).
      GEREPAREERD 09-08 (paginadiagnose): C&A schrijft prijzen als '24,99 EUR'
      — getal eerst — terwijl de scan 'EUR 24,99' eiste; daardoor werd maar een
      fractie van de kaarten gelezen (16 van ~39 prijzen op de pagina). Beide
      schrijfwijzen worden nu herkend.

  # ---- fase 2: breder veld (aanzetten kan altijd; zie PLAN.md §3) ----
  takko:
    name: Takko Fashion
    base: https://www.takko.com/nl-nl
    segment: breed
    enabled: false
    url_filter: "/nl-nl"
    notes: >-
      Duitse discounter gezinsmode.
      GEVALIDEERD 07-08: WERKT (100% prijsdekking) — sterke kandidaat om aan
      te zetten als vervanger zolang Wibra/KiK geblokkeerd zijn.
  kik:
    name: KiK
    base: https://www.kik.nl
    segment: breed
    enabled: true
    color_slot: 8
    strategy: render
    enrich: false
    max_categories: 45
    max_pages_per_category: 15
    notes: >-
      Laagste prijspunten van de markt.
      GEVALIDEERD 07-08: WERKT via de render-strategie na cookiemuur (25
      artikelen); titel-/prijsextractie verbeterd 07-08 (losse getallen als
      '599' worden niet meer als prijs of titel gelezen). Aangezet als
      werkende discounter naast Zeeman/Wibra.
      BIJGESTELD 09-08: 500 categorieën binnen focus, waarvan er 20 werden
      gecrawld — alfabetisch allemaal 'dames', waardoor KiK in week 32 als
      damesspeciaalzaak in de cijfers stond. Nu 45 categorieën én spreiding
      over doelgroepen bij het afkappen.
      LEESFOUT HERSTELD 03-09: de kaart rendert de prijs als '€' + '8' +
      '<sup>99</sup>'; innerText plakt dat tot '€899'. Tot W36 las de
      scraper dat als €899 (weggefilterd) of €199 (als prijs), en viel
      hij terug op de stukprijs uit '(0,66 € / Stuk)' — vandaar 60
      artikelen onder €1 en 196 onder €2 in W36. Diagnose 03-09 (run
      33776017208): zonder herstel 44 van 144 kaarten gelezen, alle 44
      afgeprijsd (alleen kaarten met een decimale doorstreepprijs
      overleefden). Sinds 03-09 zijn drie/vier cijfers direct achter het
      €-teken euro's+centen; multipacks dragen nu de pakprijs. Verwacht in
      W37: prijssprong t.o.v. W36 voor multipacks (0,66 → 1,99 is een
      leescorrectie, geen prijsverhoging). De omnibusregel '30 dagen
      beste prijs: € 3,99 (-25%)' telt niet als promotekst.
      PAKGROOTTE 04-09: KiK zet de pack-grootte niet in de artikelnaam
      maar wél als stukprijs op de kaart ('(0,66 € / Stuk)'); pakprijs ÷
      stukprijs levert nu pack_size, zodat de per-stuk-index klopt.
  scapino:
    name: Scapino
    base: https://www.scapino.nl
    segment: breed
    enabled: false
    notes: >-
      Waardesegment schoenen + casual; sokken relevant.
      GEVALIDEERD 07-08: scraper werkt, maar steekproef raakte geen bodywear.
  shoeby:
    name: Shoeby
    base: https://www.shoeby.nl
    segment: breed
    enabled: false
    notes: >-
      Middensegment gezinsmode.
      GEVALIDEERD 07-08: werkt; beperkt bodywear-aanbod.
  msmode:
    name: MS Mode
    base: https://www.msmode.nl
    segment: breed
    enabled: false
    notes: >-
      Damesmode; panty's/shapewear relevant, hoger prijspunt.
      GEVALIDEERD 07-08: WERKT — kandidaat voor de bovenkant van het veld.
  bonprix:
    name: Bonprix
    base: https://www.bonprix.nl
    segment: breed
    enabled: false
    notes: >-
      Online gezinsmode; grote maten sterk.
      GEVALIDEERD 07-08: WERKT goed (34/40 binnen focus) — sterke kandidaat.
