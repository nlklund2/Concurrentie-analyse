# Folderbronnen valideren zonder database: per bron de folderpagina ophalen,
# de viewer herkennen (pdf / Publitas / iPaper / eigen viewer) en de
# capture-route adviseren. Rapport in de job-samenvatting.
#
# De mailboxcontrole (alleen-lezen: login, aantal, bronherkenning) draait
# alleen als de invoer 'mailbox' op true staat én de IMAP-secrets bestaan.
# Sinds 08-09-2026 staat de e-mailverzameling ON HOLD; standaard raakt deze
# workflow de mailbox dus niet aan. Het mailadres komt nooit in de uitvoer —
# Actions-logs van deze repo zijn openbaar.
#
# Hoort bij de foldermonitor (docs/foldermonitor-plan.md §4.4, §9.5). Dit
# bestand staat op main omdat GitHub een workflow_dispatch alleen aanbiedt
# voor workflows op de default branch; de CODE komt van de branch in 'ref'
# (standaard de integratiebranch uit de variabele FOLDERS_REF). Raakt de
# scraper en het weekrapport niet.
name: Validatie folders

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch met de foldermonitor-code (leeg = FOLDERS_REF, anders deze branch)"
        required: false
        default: ""
      bronnen:
        description: "Alleen deze bronnen (id's uit folders/bronnen.yml, gescheiden door spaties; leeg = alle)"
        required: false
        default: ""
      mailbox:
        description: "Ook de mailbox controleren (alleen-lezen; e-mailverzameling staat on hold, standaard uit)"
        type: boolean
        required: false
        default: false

jobs:
  valideren:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: preview
    env:
      INPUT_BRONNEN: ${{ inputs.bronnen }}
      FOLDER_IMAP_HOST: ${{ vars.FOLDER_IMAP_HOST || 'imap.gmail.com' }}
      FOLDER_IMAP_USER: ${{ secrets.FOLDER_IMAP_USER }}
      FOLDER_IMAP_PASSWORD: ${{ secrets.FOLDER_IMAP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || vars.FOLDERS_REF || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Afhankelijkheden installeren
        run: pip install -r requirements.txt

      - name: Folderbronnen valideren
        run: |
          EXTRA=""
          for b in $INPUT_BRONNEN; do EXTRA="$EXTRA --bron $b"; done
          python -m folders validate $EXTRA

      - name: Mailbox controleren (alleen op verzoek; overgeslagen zonder IMAP-secrets)
        if: ${{ inputs.mailbox && env.FOLDER_IMAP_USER != '' }}
        run: python -m folders mailbox --out mailbox-check.md

      - name: Rapport in job-samenvatting tonen
        if: always()
        run: |
          [ -f validatie-folders.md ] && cat validatie-folders.md >> "$GITHUB_STEP_SUMMARY"
          [ -f mailbox-check.md ] && cat mailbox-check.md >> "$GITHUB_STEP_SUMMARY"
          true

      - name: Rapport als artifact bewaren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validatierapport-folders
          path: validatie-folders.md
          if-no-files-found: ignore
