# Waarom levert een pagina niets op? Draai dit zodra een bron rood kleurt en je
# niet weet waaróm. Het rapport toont alle signalen waar de extractie op kan
# aanhaken — inclusief de signalen die de scraper nu nog niet gebruikt.
name: Paginadiagnose

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Te onderzoeken pagina's (gescheiden door spaties)"
        required: true
      render:
        description: "Met headless browser (ja/nee)"
        required: false
        default: "ja"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      INPUT_URLS: ${{ inputs.urls }}
      INPUT_RENDER: ${{ inputs.render }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Afhankelijkheden installeren
        run: pip install -r requirements.txt

      - name: Headless browser
        if: inputs.render == 'ja'
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Diagnose draaien
        run: |
          ARGS=""
          for u in $INPUT_URLS; do ARGS="$ARGS --url $u"; done
          if [ "$INPUT_RENDER" != "ja" ]; then ARGS="$ARGS --no-render"; fi
          python -m scraper diagnose $ARGS

      - name: Rapport in job-samenvatting tonen
        if: always()
        run: |
          if [ -f diagnose-rapport.md ]; then
            cat diagnose-rapport.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Rapport als artifact bewaren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnose-rapport
          path: diagnose-rapport.md
          if-no-files-found: ignore
