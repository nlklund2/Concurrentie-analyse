# Wekelijkse concurrentiescrape — maandagochtend vroeg, zodat het rapport er
# vóór het maandagochtend-overleg (09:00) ligt. Cron loopt in UTC en volgt
# géén zomertijd: 04:07 UTC = 06:07 NL-zomertijd / 05:07 NL-wintertijd.
# Wil je 06:07 het hele jaar rond, zet de expressie eind oktober op "7 5 * * 1"
# en eind maart weer terug.
#
# Waarom :07 en niet :00 — GitHub voert geplande runs 'best effort' uit en slaat
# ze bij drukte over zónder melding. Het hele uur is veruit het drukste moment
# (iedereen zet zijn cron op :00); GitHub raadt daarom zelf aan een paar minuten
# ernaast te gaan zitten. Op 10-08-2026 werd de run van 04:00 UTC inderdaad
# helemaal niet gestart en moest hij handmatig worden aangezwengeld.
name: Wekelijkse scrape

on:
  schedule:
    - cron: "7 4 * * 1"
  workflow_dispatch:
    inputs:
      retailers:
        description: "Alleen deze bronnen (gescheiden door spaties; leeg = alle)"
        required: false
        default: ""

concurrency:
  group: wekelijkse-scrape
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
      REPORT_EMAIL_FROM: ${{ secrets.REPORT_EMAIL_FROM }}
      INPUT_RETAILERS: ${{ inputs.retailers }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Afhankelijkheden installeren
        run: pip install -r requirements.txt

      - name: Headless browser voor render-bronnen
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Scrapen en verwerken
        run: |
          EXTRA=""
          for r in $INPUT_RETAILERS; do EXTRA="$EXTRA --retailer $r"; done
          python -m scraper scrape $EXTRA

      - name: Weekrapport genereren
        run: python -m scraper report

      - name: Rapport in job-samenvatting tonen
        run: cat reports/latest.md >> "$GITHUB_STEP_SUMMARY"

      - name: Rapport committen
        run: |
          git config user.name "concurrentiemonitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          if ! git diff --cached --quiet; then
            git commit -m "Weekrapport $(date -u +%G-W%V)"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Ruwe data bewaren (60 dagen)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruwe-data-${{ github.run_id }}
          path: out/
          retention-days: 60
          if-no-files-found: ignore
