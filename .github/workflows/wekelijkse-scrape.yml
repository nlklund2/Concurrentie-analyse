# Wekelijkse concurrentiescrape — maandagnacht, zodat de weekmail er ruim
# vóór 07:00 ligt en het rapport vóór het maandagochtend-overleg (09:00).
#
# Meerdere cron-slots, één meting. GitHub voert geplande runs 'best effort' uit:
# bij drukte start een run uren te laat of helemaal niet, zónder melding. Met
# één slot (01:07 UTC) startte de run op 14-09-2026 en 21-09-2026 ruim vijf uur
# te laat (21-09: 08:13 NL) en kwam de weekmail dus na 07:00. Daarom staan er
# nu vijf slots; het eerste dat écht start doet de meting, en de job 'poort'
# (scraper/planning.py) laat elk later slot zichzelf overslaan zodra er een run
# loopt of de week al gemeten is (scrape_runs in Supabase). Een overgeslagen
# slot kost ±1 minuut. Handmatig starten (workflow_dispatch) meet altijd.
#
# Cron loopt in UTC en volgt géén zomertijd (NL-zomertijd / NL-wintertijd):
#   "7 23 * * 0"  zo 23:07 UTC = ma 01:07 / 00:07   ← normale start
#   "37 0 * * 1"  ma 00:37 UTC = ma 02:37 / 01:37
#   "7 2 * * 1"   ma 02:07 UTC = ma 04:07 / 03:07
#   "37 3 * * 1"  ma 03:37 UTC = ma 05:37 / 04:37   ← laatste dat 07:00 haalt (meting ±70 min)
#   "17 5 * * 1"  ma 05:17 UTC = ma 07:17 / 06:17   ← vangnet: mail te laat, wel vóór het overleg
# Geen slot vóór zo 23:00 UTC: in de winter is dat in Nederland nog zondag en
# zou de meting in de vorige week boeken (week_monday() in scraper/config.py
# rekent in NL-tijd; tests/test_planning.py bewaakt dit voor elk slot).
#
# Waarom nooit :00 of :30 — het hele en halve uur zijn de drukste momenten
# (iedereen zet zijn cron daar); GitHub raadt zelf aan ernaast te gaan zitten.
# Op 10-08-2026 werd de run van 04:00 UTC helemaal niet gestart.
#
# Ook vijf slots zijn geen garantie: controleer maandagochtend of de mail er
# is, en start anders handmatig (Actions → Wekelijkse scrape → Run workflow).
name: Wekelijkse scrape

on:
  schedule:
    - cron: "7 23 * * 0"
    - cron: "37 0 * * 1"
    - cron: "7 2 * * 1"
    - cron: "37 3 * * 1"
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      retailers:
        description: "Alleen deze bronnen (gescheiden door spaties; leeg = alle)"
        required: false
        default: ""
      alleen_rapport:
        description: "Niets meten, alleen weekrapport en weekmail opnieuw uit de database genereren (na een schoning)"
        type: boolean
        required: false
        default: false
      mail_to:
        description: "Proefmail: weekmail naar dit adres i.p.v. de vaste ontvangers (leeg = vaste ontvangers)"
        required: false
        default: ""
      geen_mail:
        description: "Weekmail wel bouwen (reports/ + dashboard), niet versturen"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  # Planningspoort: alleen bij een geplande run. Geeft 'meten=false' als een
  # eerder slot al loopt of de week al gemeten is. Faalt de poort zelf, dan
  # blijft de uitvoer leeg en wordt er gewoon gemeten (stilte is het risico).
  poort:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      meten: ${{ steps.poort.outputs.meten || 'true' }}
    steps:
      - uses: actions/checkout@v4
        if: ${{ github.event_name == 'schedule' }}
        continue-on-error: true

      - uses: actions/setup-python@v5
        if: ${{ github.event_name == 'schedule' }}
        continue-on-error: true
        with:
          python-version: "3.12"
          cache: pip

      - name: Is deze week al gemeten of loopt er al een run?
        id: poort
        if: ${{ github.event_name == 'schedule' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          pip install -r requirements.txt
          python -m scraper.planning

  scrape:
    needs: poort
    if: ${{ !cancelled() && needs.poort.outputs.meten != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    # Op de job, niet op de workflow: een overgeslagen slot hoeft dan niet in
    # de rij en verdringt geen wachtende run.
    concurrency:
      group: wekelijkse-scrape
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
      REPORT_EMAIL_FROM: ${{ secrets.REPORT_EMAIL_FROM }}
      REPORT_EMAIL_REPLY_TO: ${{ secrets.REPORT_EMAIL_REPLY_TO }}
      DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
      INPUT_RETAILERS: ${{ inputs.retailers }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Afhankelijkheden installeren
        run: pip install -r requirements.txt

      # alleen_rapport: na een schoning van de database (zie docs/validaties/)
      # rapport en weekmail opnieuw genereren zonder een meting te draaien.
      # Bij de cron-run is de invoer leeg en meet hij gewoon.
      - name: Headless browser voor render-bronnen
        if: ${{ !inputs.alleen_rapport }}
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Scrapen en verwerken
        id: scrape
        if: ${{ !inputs.alleen_rapport }}
        run: |
          EXTRA=""
          for r in $INPUT_RETAILERS; do EXTRA="$EXTRA --retailer $r"; done
          python -m scraper scrape $EXTRA

      # Rapport en weekmail draaien óók als de meting faalt: stilte op maandag
      # is het grootste risico (PLAN.md §9). De weekmail meldt de storing dan
      # in de kop en toont de laatst verwerkte stand per bron.
      - name: Weekrapport genereren
        if: ${{ !cancelled() }}
        run: python -m scraper report

      - name: Weekmail bouwen en versturen
        if: ${{ !cancelled() }}
        env:
          SCRAPE_OUTCOME: ${{ steps.scrape.outcome }}
        run: |
          EXTRA=""
          if [ "${{ inputs.geen_mail }}" = "true" ]; then EXTRA="--dry-run"; fi
          if [ -n "${{ inputs.mail_to }}" ]; then EXTRA="$EXTRA --to ${{ inputs.mail_to }}"; fi
          python -m scraper weekmail $EXTRA

      - name: Rapport in job-samenvatting tonen
        if: ${{ !cancelled() }}
        run: cat reports/latest.md >> "$GITHUB_STEP_SUMMARY"

      - name: Rapport en weekmail committen
        if: ${{ !cancelled() }}
        run: |
          git config user.name "concurrentiemonitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          if ! git diff --cached --quiet; then
            git commit -m "Weekrapport $(TZ=Europe/Amsterdam date +%G-W%V)"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Ruwe data bewaren (60 dagen)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruwe-data-${{ github.run_id }}
          path: out/
          retention-days: 60
          if-no-files-found: ignore
